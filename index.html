<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe4f0; --bg2:#fff0f5; --card:#ffffff; --title:#cc2255; --text:#883355;
  --main:#e0235a; --main-d:#c0184a; --dot:#f4a0c0; --shadow:rgba(200,50,100,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2a0d2e; --bg2:#1d0a22; --card:#341339; --title:#ff8fb0; --text:#f1c9de;
    --main:#ff4f86; --main-d:#e63a73; --dot:#6a3270; --shadow:rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a0d2e; --bg2:#1d0a22; --card:#341339; --title:#ff8fb0; --text:#f1c9de;
  --main:#ff4f86; --main-d:#e63a73; --dot:#6a3270; --shadow:rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.container{min-height:480px;width:100%;max-width:500px;margin:20px;padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border-radius:22px;position:relative;overflow:hidden;box-shadow:0 8px 32px var(--shadow)}
#slides{width:100%}
.slide{display:none;text-align:center;width:100%;animation:fadeIn .5s ease}
.slide.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.emoji-big{font-size:68px;margin-bottom:14px;display:block;line-height:1.1}
.slide-title{font-family:'Gloock',Georgia,'Times New Roman',serif;font-size:24px;color:var(--title);margin-bottom:12px;line-height:1.3}
.slide-text{font-size:16px;line-height:1.7;max-width:380px;margin:0 auto;white-space:pre-line}
.sign{margin-top:14px;font-weight:700;color:var(--title)}
.btn-row{display:flex;gap:14px;margin-top:28px;justify-content:center;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--title);outline-offset:3px}
.btn-next{font-size:16px;font-weight:700;padding:12px 28px;background:var(--main);color:#fff;border:0;border-radius:50px;transition:background .2s,transform .1s}
.btn-next:hover{background:var(--main-d)}
.btn-next:active{transform:scale(.97)}
.btn-restart{font-size:14px;font-weight:600;padding:10px 22px;background:transparent;color:var(--main);border:2px solid var(--main);border-radius:50px}
.btn-restart:hover{background:var(--bg2)}
.photos{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.polaroid{margin:0;width:min(150px,40vw);padding:7px 7px 9px;background:#fff;border-radius:6px;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);transform:rotate(var(--tilt,0deg))}
.photos.one .polaroid{width:min(230px,62vw)}
.polaroid img,.polaroid .ph{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px}
.polaroid .ph{display:grid;place-items:center;background:var(--dot);font-size:38px}
.polaroid figcaption{margin-top:7px;font-size:12.5px;font-weight:600;line-height:1.3;color:#5a2a44}
.quote{margin:18px auto 0;max-width:340px;padding:2px 14px;border-left:4px solid var(--main);font-family:'Gloock',Georgia,serif;font-size:17px;line-height:1.4;text-align:left;color:var(--title)}
.cake{position:relative;display:inline-block}
.cake .flame{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:30px;animation:flick .9s ease-in-out infinite alternate}
.cake.out .flame{display:none}
@keyframes flick{from{transform:translateX(-50%) scale(1) rotate(-4deg)}to{transform:translateX(-50%) scale(.9,1.12) rotate(4deg)}}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.heart{position:absolute;font-size:20px;opacity:0;animation:floatUp 3s ease-in forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-320px) rotate(20deg)}}
.progress{display:flex;gap:8px;margin-bottom:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dot);transition:background .3s}
.dot.done{background:var(--main)}
@media (max-width:480px){.slide-title{font-size:20px}.emoji-big{font-size:54px}}
@media (prefers-reduced-motion:reduce){.slide,.cake .flame,.heart{animation:none}}
</style>
</head>
<body>
<div class="container">
  <div class="hearts" id="heartsBox"></div>
  <div class="progress" id="progressDots"></div>
  <div id="slides"></div>
</div>

  'Thank you meri smile ki wajah banne ke liye. ❤️.',

  'Thank you meri smile ki wajah banne ke liye. ❤️'
];


(function () {
  const $ = (id) => document.getElementById(id);
  const fill = (s) => s.split('{name}').join(CONFIG.name);
  const slidesEl = $('slides'), dotsEl = $('progressDots');
  const total = SLIDES.length + 1;
  let current = 0, lastWish = -1;

  function mk(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }
  function slide(id) { const s = mk('div', 'slide'); s.id = id; slidesEl.appendChild(s); return s; }
  function nextBtn(label, fn) {
    const row = mk('div', 'btn-row');
    const b = mk('button', 'btn-next', label);
    b.addEventListener('click', fn);
    row.appendChild(b);
    return row;
  }
  function photoStrip(list) {
    const w = mk('div', 'photos' + (list.length === 1 ? ' one' : ''));
    list.slice(0, 3).forEach((p, i) => {
      const f = mk('figure', 'polaroid');
      f.style.setProperty('--tilt', [-3, 2.5, -1.5][i % 3] + 'deg');
      const img = mk('img');
      img.src = p.src; img.alt = p.caption || 'Our photo'; img.loading = 'lazy';
      img.addEventListener('error', () => img.replaceWith(mk('div', 'ph', '📷')));
      f.appendChild(img);
      if (p.caption) f.appendChild(mk('figcaption', '', p.caption));
      w.appendChild(f);
    });
    return w;
  }
  const top = (d) => d.photos ? photoStrip(d.photos) : mk('span', 'emoji-big', d.emoji);

  SLIDES.forEach((d, i) => {
    const s = slide('slide-' + i);
    s.append(top(d), mk('div', 'slide-title', fill(d.title)), mk('div', 'slide-text', fill(d.text)), nextBtn(d.btn, nextSlide));
  });

  const cakeIdx = SLIDES.length;
  const cs = slide('slide-' + cakeIdx);
  const cake = mk('span', 'cake');
  cake.append(mk('span', 'emoji-big', '🎂'), mk('span', 'flame', '🔥'));
  const cakeText = mk('div', 'slide-text', CAKE.text);
  cs.append(cake, mk('div', 'slide-title', CAKE.title), cakeText,
    nextBtn(CAKE.btn, () => {
      if (cake.classList.contains('out')) return;
      cake.classList.add('out');
      cakeText.textContent = CAKE.doneText;
      spawnHearts(24);
      setTimeout(showFinal, 1400);
    }));

  const fs = slide('slide-final');
  const quoteEl = mk('div', 'quote');
  const fRow = mk('div', 'btn-row');
  const qb = mk('button', 'btn-next', 'Ek aur wish 💌');
  const rb = mk('button', 'btn-restart', 'Phir se dekho');
  fRow.append(qb, rb);
  fs.append(top(FINAL), mk('div', 'slide-title', fill(FINAL.title)), mk('div', 'slide-text', fill(FINAL.text)),
    quoteEl, mk('div', 'sign', '— ' + CONFIG.from), fRow);

  for (let i = 0; i < total; i++) {
    const d = mk('div', 'dot' + (i === 0 ? ' done' : '')); d.id = 'dot-' + i; dotsEl.appendChild(d);
  }
  $('slide-0').classList.add('active');

  function setActive(id) {
    document.querySelectorAll('.slide').forEach((s) => s.classList.remove('active'));
    $(id).classList.add('active');
  }
  function updateDots() {
    for (let i = 0; i < total; i++) $('dot-' + i).className = 'dot' + (i <= current ? ' done' : '');
  }
  function nextSlide() {
    current++;
    setActive('slide-' + current);
    updateDots();
    spawnHearts(6);
  }
  function nextWish() {
    let i;
    do { i = Math.floor(Math.random() * WISHES.length); } while (WISHES.length > 1 && i === lastWish);
    lastWish = i;
    quoteEl.textContent = WISHES[i];
  }
  function showFinal() {
    setActive('slide-final');
    dotsEl.style.display = 'none';
    nextWish();
    spawnHearts(26);
  }
  function restart() {
    current = 0;
    cake.classList.remove('out');
    cakeText.textContent = CAKE.text;
    dotsEl.style.display = 'flex';
    updateDots();
    setActive('slide-0');
  }
  qb.addEventListener('click', nextWish);
  rb.addEventListener('click', restart);

  function spawnHearts(count) {
    const box = $('heartsBox');
    const emojis = ['🌸', '💖', '🎉', '🎈', '✨', '💐'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const h = mk('div', 'heart', emojis[Math.floor(Math.random() * emojis.length)]);
        h.style.left = Math.random() * 90 + '%';
        h.style.bottom = '0';
        h.style.animationDuration = (2 + Math.random() * 2) + 's';
        box.appendChild(h);
        setTimeout(() => h.remove(), 4500);
      }, i * 130);
    }
  }
})();
</script>
</body>
</html>
